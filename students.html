<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>КТТО — Студентам</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #ffffff;
            font-family: 'Open Sans', 'Roboto', 'PT Sans', sans-serif;
            color: #1f2e3a;
        }
        .wrapper { max-width: 1400px; margin: 0 auto; padding: 0 30px; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 3px solid #01AABD;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }
        .logo img { height: 55px; object-fit: contain; }
        .nav { display: flex; gap: 24px; flex-wrap: wrap; }
        .nav a {
            text-decoration: none;
            font-weight: 600;
            color: #1f2e3a;
            padding: 8px 18px;
            border-radius: 50px;
            transition: all 0.2s ease;
        }
        .nav a:hover, .nav a.active { background: #01AABD; color: white; }

        .page-title {
            font-size: 2.4rem;
            font-weight: 700;
            margin: 20px 0 40px;
            color: #0F172A;
        }
        .content-placeholder {
            background: #F8FAFC;
            border-radius: 48px;
            padding: 60px 48px;
            text-align: center;
            margin-bottom: 60px;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 24px;
        }
        .content-placeholder h2 { font-size: 1.8rem; color: #01AABD; }
        .content-placeholder p { color: #475569; max-width: 600px; }

        @media (max-width: 860px) {
            .wrapper { padding: 0 20px; }
            .header { flex-direction: column; align-items: stretch; text-align: center; }
            .nav { justify-content: center; gap: 12px; }
            .nav a { padding: 8px 14px; background: #f0f6f8; }
            .page-title { font-size: 1.8rem; text-align: center; }
            .content-placeholder { padding: 40px 24px; }
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="header">
        <div class="logo"><img src="src/logoKTTO.jpg" alt="Логотип"></div>
        <div class="nav">
            <a href="index.html">Главная</a>
            <a href="about.html">О нас</a>
            <a href="admission.html">Поступление</a>
            <a href="students.html" class="active">Студентам</a>
            <a href="contacts.html">Контакты</a>
        </div>
    </div>

    <div class="page-title">Студентам</div>
    <div class="content-placeholder">
        <h2>🎓 Учебный процесс и жизнь студентов</h2>
        <p>Расписание, стипендии, общежитие, внеучебная деятельность, практика, библиотека и другие сервисы для студентов.</p>
        <p style="font-size: 0.85rem;">(Контент появится после подключения FastAPI)</p>
    </div>
</div>
</body>
</html>
